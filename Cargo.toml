[workspace]
members = ["."]
resolver = "2"

[package]
name = "isk"
version = "0.1.0"
edition = "2021"
description = "ISK: a semantic-first programming language and compiler built for autonomous coding agents"
repository = "https://github.com/deed-ee/isk"
readme = "README.md"
license = "MIT"

[dependencies]
serde_json = "1"
sha2 = "0.10"
tempfile = "3"

[lib]
name = "isk"
path = "src/lib.rs"

[[bin]]
name = "isk"
path = "src/main.rs"
