name: Feature request
description: Suggest an improvement to the compiler, tooling, or documentation.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem and use case
      description: What are you trying to do, and where does the current workflow fall short?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed functionality and expected benefit
      description: Describe what would change and who would benefit.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Include workarounds if you know any.
