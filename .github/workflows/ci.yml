name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Build the ISK CLI
        run: cargo build --locked --bin isk
      - name: Test Rust code, ISK examples, and the controller showcase
        run: cargo test --locked --workspace
      - name: Smoke-test the numerical benchmark
        run: python3 benchmarks/pilot.py --task all --trials 1
